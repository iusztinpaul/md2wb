name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Convert the example article
        run: |
          node dist/cli.js examples/article.md -o "$RUNNER_TEMP/article-substack.html"
          node dist/cli.js examples/article.md -t x -o "$RUNNER_TEMP/article-x.html"
